<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive Mood Board | Mustafa</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <form action="" class="note">
            <div class="input">
                <span class="color-bg"></span>
                <span class="color-circle"></span>
                <input type="range" min="0" max="360" value="0">
            </div>
            <button type="button" class="creat-note-btn">+</button>
        </form>
        <form action="" class="file">
            <input type="file" class="imgUpload" accept="image/*">
            <span class="file-text">Upload Your Image</span>
        </form>
        <div class="list"></div>
    </main>

</body>

<script src="script.js"></script>

</html>
